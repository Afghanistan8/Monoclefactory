[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monocle-sdk"
version = "0.1.0"
description = "Python agent SDK for MONOCLE on GenLayer Studio Next (Consensus v0.6 RC)."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["genlayer-py==0.19.0rc2"]

[tool.setuptools]
packages = ["monocle_sdk"]
